<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - البلاغات الواردة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-bar h1 { font-size: 22px; color: #2c3e50; }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        .btn-print {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-print:hover { background-color: #16a085; }

        /* شبكة الخانات الأربع بجانب بعضها */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        @media (max-width: 1024px) {
            .categories-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .categories-grid { grid-template-columns: 1fr; }
        }

        .category-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
            border-top: 4px solid #3498db;
        }

        .category-header {
            padding: 15px;
            background: #fafafa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #eee;
        }
        .category-header:hover { background: #f0f0f0; }

        .badge-count {
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .category-content {
            padding: 15px;
            display: none; /* مخفية افتراضياً، تظهر عند الضغط */
            max-height: 400px;
            overflow-y: auto;
        }

        .category-content.active {
            display: block;
        }

        .report-item {
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .report-item p { margin: 5px 0; font-size: 13px; }
        
        /* نافذة اختيار الأشخاص للطباعة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header { font-weight: bold; margin-bottom: 15px; font-size: 18px; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; color: #e74c3c; }
    </style>
</head>
<body>

    <!-- شريط التحكم العلوي -->
    <div class="header-bar">
        <h1>لوحة تحكم المسؤول - البلاغات الواردة</h1>
        <div class="controls-group">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث بالاسم الكامل..." onkeyup="filterReports()">
            <select id="governorateFilter" class="filter-select" onchange="filterReports()">
                <option value="">جميع المحافظات</option>
                <option value="دمشق">دمشق</option>
                <option value="ريف دمشق">ريف دمشق</option>
                <option value="حلب">حلب</option>
                <option value="حمص">حمص</option>
                <option value="حماة">حماة</option>
                <option value="إدلب">إدلب</option>
                <option value="اللاذقية">اللاذقية</option>
                <option value="طرطوس">طرطوس</option>
                <option value="دير الزور">دير الزور</option>
                <option value="الرقة">الرقة</option>
                <option value="الحسكة">الحسكة</option>
                <option value="درعا">درعا</option>
                <option value="السويداء">السويداء</option>
                <option value="القنيطرة">القنيطرة</option>
            </select>
            <button class="btn-print" onclick="openPrintModal()"><i class="fa fa-print"></i> طباعة التقارير</button>
        </div>
    </div>

    <!-- الخانات الأربع بجانب بعضها -->
    <div class="categories-grid" id="categoriesContainer">
        <!-- الخانة الأولى -->
        <div class="category-card">
            <div class="category-header" onclick="toggleCategory(this)">
                <span>شبيح</span>
                <span class="badge-count">1</span>
            </div>
            <div class="category-content active">
                <div class="report-item" data-name="داهو وود" data-gov="دير الزور">
                    <p><strong>الاسم:</strong> داهو وود</p>
                    <p><strong>المحافظة:</strong> دير الزور</p>
                    <p><strong>الجنسية:</strong> سوري</p>
                    <p><strong>مكان السكن:</strong> درعا بيت ياشوط</p>
                    <p><strong>سجل القتال:</strong> مع إيران</p>
                    <p><strong>رقم الهاتف:</strong> 888765</p>
                </div>
            </div>
        </div>

        <!-- الخانة الثانية -->
        <div class="category-card">
            <div class="category-header" onclick="toggleCategory(this)">
                <span>تاجر مخدرات</span>
                <span class="badge-count">0</span>
            </div>
            <div class="category-content">
                <p style="text-align: center; color: #888; font-size: 13px;">لا توجد بلاغات حالياً</p>
            </div>
        </div>

        <!-- الخانة الثالثة -->
        <div class="category-card">
            <div class="category-header" onclick="toggleCategory(this)">
                <span>عميل</span>
                <span class="badge-count">0</span>
            </div>
            <div class="category-content">
                <p style="text-align: center; color: #888; font-size: 13px;">لا توجد بلاغات حالياً</p>
            </div>
        </div>

        <!-- الخانة الرابعة -->
        <div class="category-card">
            <div class="category-header" onclick="toggleCategory(this)">
                <span>أخرى / تواصل</span>
                <span class="badge-count">0</span>
            </div>
            <div class="category-content">
                <p style="text-align: center; color: #888; font-size: 13px;">لا توجد بلاغات حالياً</p>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار الأشخاص للطباعة -->
    <div class="modal" id="printModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>اختر الأشخاص للطباعة</span>
                <span class="close-modal" onclick="closePrintModal()">&times;</span>
            </div>
            <div id="printPersonsList" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px;"><input type="checkbox" value="داهو وود"> داهو وود (شبيح - دير الزور)</label>
            </div>
            <button class="btn-print" style="width: 100%; justify-content: center;" onclick="printSelected()">طباعة المحدد</button>
        </div>
    </div>

    <script>
        // إظهار أو إخفاء محتوى الخانة عند الضغط على العنوان
        function toggleCategory(headerElement) {
            const content = headerElement.nextElementSibling;
            content.classList.toggle('active');
        }

        // البحث والتصفية حسب الاسم أو المحافظة
        function filterReports() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedGov = document.getElementById('governorateFilter').value;
            
            const reports = document.querySelectorAll('.report-item');
            reports.forEach(report => {
                const name = report.getAttribute('data-name').toLowerCase();
                const gov = report.getAttribute('data-gov');
                
                const matchesSearch = name.includes(searchTerm);
                const matchesGov = !selectedGov || gov === selectedGov;

                if (matchesSearch && matchesGov) {
                    report.style.display = 'block';
                    // توسيع الخانة تلقائياً عند البحث المطابق
                    report.closest('.category-content').classList.add('active');
                } else {
                    report.style.display = 'none';
                }
            });
        }

        // فتح وإغلاق نافذة الطباعة
        function openPrintModal() {
            document.getElementById('printModal').style.display = 'flex';
        }
        function closePrintModal() {
            document.getElementById('printModal').style.display = 'none';
        }
        function printSelected() {
            window.print();
        }
    </script>
</body>
</html>

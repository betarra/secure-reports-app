<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - البلاغات الواردة</title>
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { background-color: #0f172a !important; color: #f1f5f9 !important; font-family: system-ui, sans-serif; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .border-slate-700 { border-color: #334155 !important; }
        .tab-btn { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- رأس الصفحة الرئيسي -->
        <div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
            <h1 class="text-2xl font-bold text-emerald-400">لوحة تحكم المسؤول - البلاغات الواردة</h1>
            <a href="/" target="_blank" style="background-color: #059669; padding: 8px 16px; border-radius: 12px; color: white; text-decoration: none; font-size: 14px; font-weight: 500;">
                فتح نموذج البلاغ
            </a>
        </div>

        <!-- أزرار التصنيفات المنسقة بستايل احترافي جميل وجذاب -->
        <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px;">
            <button onclick="filterReports('شبيح')" class="tab-btn" style="flex: 1; min-width: 150px; padding: 20px; border-radius: 16px; cursor: pointer; background-color: #1e293b; border: 1px solid #334155; text-align: center;">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #f87171;">شبيح</span>
            </button>
            <button onclick="filterReports('تاجر مخدرات')" class="tab-btn" style="flex: 1; min-width: 150px; padding: 20px; border-radius: 16px; cursor: pointer; background-color: #1e293b; border: 1px solid #334155; text-align: center;">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #fbbf24;">تاجر مخدرات</span>
            </button>
            <button onclick="filterReports('لص')" class="tab-btn" style="flex: 1; min-width: 150px; padding: 20px; border-radius: 16px; cursor: pointer; background-color: #1e293b; border: 1px solid #334155; text-align: center;">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #38bdf8;">لص</span>
            </button>
            <button onclick="filterReports('آخر')" class="tab-btn" style="flex: 1; min-width: 150px; padding: 20px; border-radius: 16px; cursor: pointer; background-color: #1e293b; border: 1px solid #334155; text-align: center;">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #34d399;">آخر</span>
            </button>
        </div>

        <!-- منطقة عرض التقارير المفرزة عمودياً بناءً على الخيار المختار -->
        <div style="margin-top: 25px; padding: 24px; border-radius: 16px; background-color: #1e293b; border: 1px solid #334155;">
            <h2 id="categoryTitle" style="font-size: 16px; font-weight: bold; color: #34d399; margin-bottom: 20px; text-align: center;">الرجاء اختيار تصنيف من الأعلى لعرض بلاغاته بشكل معزول ومستقل</h2>
            
            <!-- الحاوية العمودية الذكية للبطاقات المنظمة -->
            <div id="cardsContainer" style="display: flex; flex-direction: column; gap: 16px; max-width: 600px;
 margin: 0 auto;">
                <div style="text-align: center; padding: 32px; color: #64748b; font-size: 14px;">
                    الصفحة مغلقة حالياً. انقر على أحد الأزرار بالأعلى للفرز التلقائي المباشر للبيانات.
                </div>
            </div>
        </div>

    </div>

    <!-- الحاوية المخفية الآمنة لنقل البيانات البرمجية ومنع أخطاء VS Code نهائياً -->
    <div id="temp-data" data-reports='{{ reports | tojson | safe }}' style="display: none;"></div>

    <script>
        const dataElement = document.getElementById('temp-data');
        const allReports = JSON.parse(dataElement.getAttribute('data-reports') || '[]');

        function renderCards(reportsToDisplay, category) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (reportsToDisplay.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 32px; color: #64748b; font-size: 14px;">لا توجد بلاغات مسجلة في خانة (' + category + ') حالياً.</div>';
                return;
            }

            let accentColor = '#34d399';
            if (category === 'شبيح') accentColor = '#f87171';
            else if (category === 'تاجر مخدرات') accentColor = '#fbbf24';
            else if (category === 'لص') accentColor = '#38bdf8';

            reportsToDisplay.forEach(function(report) {
                const card = document.createElement('div');
                card.style.backgroundColor = '#0f172a';
                card.style.padding = '20px';
                card.style.borderRadius = '12px';
                card.style.border = '1px solid #334155';
                card.style.borderTop = '4px solid ' + accentColor;
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.style.gap = '10px';

                const reportId = report.id || '';

                // فحص وجود دليل مرفق (صورة أو فيديو) لعرض خيار التحميل
                let mediaSection = '';
                if (report.media_link) {
                    mediaSection = '<div style="background-color: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-top: 5px;">' +
                                   '<span style="color: #94a3b8; font-size: 13px; display: block; margin-bottom: 4px;">🎞️ دليل مرفق (صورة / فيديو):</span>' +
                                   '<a href="' + report.media_link + '" target="_blank" style="color: #38bdf8; font-size: 13px; font-weight: bold; text-decoration: underline; display: inline-block;">اضغط هنا لفتح وتحميل ملف الدليل</a>' +
                                   '</div>';
                } else {
                    mediaSection = '<div><strong style="color: #94a3b8; font-size: 13px;">🎞️ الأدلة المرفقة:</strong> <span style="color: #64748b; font-size: 13px;">لم يتم إرفاق رابط وسائط</span></div>';
                }

                card.innerHTML = 
                    '<div style="font-size: 14px; color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">' +
                        '<div><strong style="color: #94a3b8;">الاسم:</strong> ' + (report.suspect_name || 'بدون اسم') + '</div>' +
                        '<div><strong style="color: #94a3b8;">المحافظة:</strong> ' + (report.province || 'غير محددة') + '</div>' +
                        '<div style="grid-column: span 2;"><strong style="color: #94a3b8;">حسابات التواصل له:</strong> ' + (report.social_link || 'غير متوفرة') + '</div>' +
                        '<div style="grid-column: span 2;"><strong style="color: #94a3b8;">رقم الجوال:</strong> <span dir="ltr">' + (report.phone || 'غير متوفر') + '</span></div>' +
                    '</div>' +
                    '<div style="border-top: 1px solid #334155; pt-2; font-size: 14px;">' +
                        '<strong style="color: #94a3b8; display: block; margin-bottom: 4px;">أين كان يعمل ومع من:</strong>' +
                        '<div style="background-color: #1e293b; padding: 10px; border-radius: 8px; font-size: 12px; color: #cbd5e1; border: 1px solid #334155;">' + (report.work_details || 'لا توجد تفاصيل جهة عمل') + '</div>' +
                    '</div>' +
                    mediaSection + 
                    '<div style="font-size: 14px;">' +
                        '<strong style="color: #94a3b8; display: block; margin-bottom: 4px;">تفاصيل إضافية حول البلاغ:</strong>' +
                        '<div style="background-color: #1e293b; padding: 10px; border-radius: 8px; font-size: 12px; color: #cbd5e1; border: 1px solid #334155;">' + (report.details || 'لا توجد تفاصيل إضافية') + '</div>' +
                    '</div>' +
                    '<div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #334155; padding-top: 10px; margin-top: 5px;">' +
                        '<a href="/report/' + reportId + '" target="_blank" style="background-color: #d97706; padding: 6px 12px; border-radius: 8px; color: white; font-size: 12px; text-decoration: none; font-medium: 500;">زر طباعة</a>' +
                        '<form action="/delete-report/' + reportId + '" method="POST" style="margin: 0;" onsubmit="return confirm(\'هل أنت متأكد من حذف هذا التقرير نهائياً؟\');">' +
                            '<button type="submit" style="background-color: #e11d48; padding: 6px 12px; border-radius: 8px; color: white; font-size: 12px; cursor: pointer; border: none; font-medium: 500;">زر حذف</button>' +
                        '</form>' +
                    '</div>';
                
                container.appendChild(card);
            });
        }

        function filterReports(category) {
            document.getElementById('categoryTitle').innerText = 'التقارير الواردة في خانة: ' + category;
            const filtered = allReports.filter(function(r) { return r.category === category; });
            renderCards(filtered, category);
        }
    </script>
</body>
</html>

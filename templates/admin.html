<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - البلاغات الواردة</title>
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: system-ui, sans-serif; }
        .tab-btn { transition: all 0.2s ease; }
        .report-card { border-top: 4px solid; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- رأس الصفحة الرئيسي -->
        <div class="flex justify-between items-center bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-800">لوحة تحكم المسؤول - البلاغات الواردة</h1>
            <a href="/" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                فتح نموذج البلاغ
            </a>
        </div>

        <!-- أزرار الخانات والتصنيفات العلوية للتحكم بالعزل -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <button onclick="filterReports('شبيح')" class="tab-btn bg-white hover:bg-red-50 border border-slate-200 p-5 rounded-2xl text-center shadow-sm focus:ring-2 focus:ring-red-400">
                <span class="block text-slate-400 text-xs mb-1">عرض تصنيف</span>
                <span class="text-lg font-bold text-red-600">شبيح</span>
            </button>
            <button onclick="filterReports('تاجر مخدرات')" class="tab-btn bg-white hover:bg-amber-50 border border-slate-200 p-5 rounded-2xl text-center shadow-sm focus:ring-2 focus:ring-amber-400">
                <span class="block text-slate-400 text-xs mb-1">عرض تصنيف</span>
                <span class="text-lg font-bold text-amber-600">تاجر مخدرات</span>
            </button>
            <button onclick="filterReports('عميل')" class="tab-btn bg-white hover:bg-sky-50 border border-slate-200 p-5 rounded-2xl text-center shadow-sm focus:ring-2 focus:ring-sky-400">
                <span class="block text-slate-400 text-xs mb-1">عرض تصنيف</span>
                <span class="text-lg font-bold text-sky-600">عميل</span>
            </button>
            <button onclick="filterReports('أخرى / تواصل')" class="tab-btn bg-white hover:bg-emerald-50 border border-slate-200 p-5 rounded-2xl text-center shadow-sm focus:ring-2 focus:ring-emerald-400">
                <span class="block text-slate-400 text-xs mb-1">عرض تصنيف</span>
                <span class="text-lg font-bold text-emerald-600">أخرى / تواصل</span>
            </button>
        </div>

        <!-- منطقة عرض التقارير المعزولة والمفرزة -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h2 id="categoryTitle" class="text-xl font-bold text-slate-700 mb-6 text-center">الرجاء اختيار تصنيف من الأعلى لعرض بلاغاته المنظمة</h2>
            
            <!-- الحاوية العمودية المنظمة للبطاقات -->
            <div id="cardsContainer" class="space-y-4 max-w-xl mx-auto">
                <div class="text-center py-8 text-slate-400 text-sm">
                    انقر على أحد التصنيفات بالأعلى لفتح التقارير الخاصة به بشكل مستقل.
                </div>
            </div>
        </div>

    </div>

    <!-- الحاوية الآمنة لنقل البيانات ومنع ظهور أي أخطاء حمراء في VS Code -->
    <div id="temp-data" data-reports='{{ reports | tojson | safe }}' style="display: none;"></div>

    <script>
        // جلب البيانات القادمة من قاعدة البيانات بأمان
        const dataElement = document.getElementById('temp-data');
        const allReports = JSON.parse(dataElement.getAttribute('data-reports') || '[]');

        // دالة بناء وعرض البطاقات بشكل منظم وعمودي
        function renderCards(reportsToDisplay, category) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (reportsToDisplay.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">لا توجد بلاغات مسجلة في خانة (' + category + ') حالياً.</div>';
                return;
            }

            // تحديد لون الشريط العلوي للبطاقة بناءً على نوع الخانة
            let borderClass = 'border-slate-400';
            if (category === 'شبيح') borderClass = 'border-red-500';
            else if (category === 'تاجر مخدرات') borderClass = 'border-amber-500';
            else if (category === 'عميل') borderClass = 'border-sky-500';
            else if (category === 'أخرى / تواصل') borderClass = 'border-emerald-500';

            reportsToDisplay.forEach(function(report) {
                const card = document.createElement('div');
                card.className = 'report-card bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm space-y-2 ' + borderClass;
                
                const reportId = report.id || '';

                // بناء محتوى البطاقة المنظم مع إظهار كافة معلوماتك
                card.innerHTML = 
                    '<div class="grid grid-cols-2 gap-2 text-sm text-slate-700">' +
                        '<div><strong class="text-slate-400">الاسم:</strong> ' + (report.suspect_name || 'غير متوفر') + '</div>' +
                        '<div><strong class="text-slate-400">المحافظة:</strong> ' + (report.province || 'غير محددة') + '</div>' +
                        '<div><strong class="text-slate-400">الجنسية:</strong> ' + (report.nationality || 'سوري') + '</div>' +
                        '<div><strong class="text-slate-400">مكان السكن:</strong> ' + (report.address || 'غير محدد') + '</div>' +
                    '</div>' +
                    '<div class="text-sm text-slate-700 border-t border-slate-200/60 pt-2">' +
                        '<strong class="text-slate-400 block mb-1">سجل الفعال مع المليشيا:</strong>' +
                        '<div class="bg-white p-3 rounded-lg border border-slate-200 text-xs text-slate-600 leading-relaxed">' + 
                            (report.details || 'لا توجد تفاصيل إضافية مضافة.') + 
                        '</div>' +
                    '</div>' +
                    '<div class="text-sm text-slate-700">' +
                        '<strong class="text-slate-400">رقم الهاتف:</strong> <span dir="ltr">' + (report.phone || 'غير متوفر') + '</span>' +
                    '</div>' +
                    '<div class="flex justify-end pt-2 border-t border-slate-200/60 gap-3">' +
                        '<a href="/report/' + reportId + '" target="_blank" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">طباعة / تفاصيل</a>' +
                        '<form action="/delete-report/' + reportId + '" method="POST" onsubmit="return confirm(\'هل أنت متأكد من حذف هذا البلاغ نهائياً؟\');">' +
                            '<button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">حذف البلاغ</button>' +
                        '</form>' +
                    '</div>';
                
                container.appendChild(card);
            });
        }

        // دالة الفلترة والعزل الكامل للتصنيفات
        function filterReports(category) {
            document.getElementById('categoryTitle').innerText = 'التقارير الواردة في خانة: ' + category;
            const filtered = allReports.filter(function(r) { return r.category === category; });
            renderCards(filtered, category);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - البلاغات الواردة</title>
    <style>
        body { background-color: #0f172a !important; color: #f1f5f9 !important; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3); }
        .header h1 { margin: 0; font-size: 24px; color: #34d399; }
        .btn-link { background-color: #059669; padding: 10px 20px; border-radius: 12px; color: white; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .btn-link:hover { background-color: #047857; }
        .tabs-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
        .tab-btn { flex: 1; min-width: 140px; padding: 20px; border-radius: 16px; cursor: pointer; background-color: #1e293b; border: 1px solid #334155; text-align: center; color: white; transition: transform 0.1s; }
        .tab-btn:active { transform: scale(0.98); }
        .content-box { padding: 24px; border-radius: 16px; background-color: #1e293b; border: 1px solid #334155; }
        .content-title { font-size: 16px; font-weight: bold; color: #34d399; margin-top: 0; margin-bottom: 20px; text-align: center; }
        .cards-list { display: flex; flex-direction: column; gap: 16px; max-width: 550px; margin: 0 auto; }
        .card { background-color: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .info-grid { font-size: 14px; color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-label { color: #94a3b8; font-weight: normal; }
        .block-section { border-top: 1px solid #334155; padding-top: 10px; font-size: 14px; }
        .block-title { color: #94a3b8; display: block; margin-bottom: 6px; }
        .block-text { background-color: #1e293b; padding: 12px; border-radius: 8px; font-size: 13px; color: #cbd5e1; border: 1px solid #334155; line-height: 1.5; }
        .media-box { background-color: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .download-btn { background-color: #2563eb; color: white; padding: 6px 14px; border-radius: 6px; font-size: 12px; text-decoration: none; display: inline-block; font-weight: 500; border: none; cursor: pointer; }
        .download-btn:hover { background-color: #1d4ed8; }
        .action-bar { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #334155; padding-top: 12px; }
        .delete-btn { background-color: #e11d48; padding: 6px 14px; border-radius: 6px; color: white; font-size: 12px; cursor: pointer; border: none; font-weight: 500; }
        .delete-btn:hover { background-color: #be123c; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <h1>لوحة تحكم المسؤول - البلاغات الواردة</h1>
            <a href="/" target="_blank" class="btn-link">فتح نموذج البلاغ</a>
        </div>

        <div class="tabs-grid">
            <button onclick="filterReports('شبيح')" class="tab-btn">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #f87171;">شبيح</span>
            </button>
            <button onclick="filterReports('تاجر مخدرات')" class="tab-btn">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #fbbf24;">تاجر مخدرات</span>
            </button>
            <button onclick="filterReports('لص')" class="tab-btn">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #38bdf8;">لص</span>
            </button>
            <button onclick="filterReports('آخر')" class="tab-btn">
                <span style="display: block; color: #94a3b8; font-size: 12px; margin-bottom: 4px;">فحص تصنيف</span>
                <span style="font-size: 18px; font-weight: bold; color: #34d399;">آخر</span>
            </button>
        </div>

        <div class="content-box">
            <h2 id="categoryTitle" class="content-title">الرجاء اختيار تصنيف من الأعلى لعرض بلاغاته بشكل معزول ومستقل</h2>
            
            <div id="cardsContainer" class="cards-list">
                <div style="text-align: center; padding: 32px; color: #64748b; font-size: 14px;">
                    الصفحة معزولة حالياً. انقر على أحد الأزرار بالأعلى للفرز التلقائي المباشر والمستقل للبيانات الواردة.
                </div>
            </div>
        </div>

    </div>

    <div id="temp-data" data-reports='{{ reports | tojson | safe }}' style="display: none;"></div>
    <script>
        const dataElement = document.getElementById('temp-data');
        const allReports = JSON.parse(dataElement.getAttribute('data-reports') || '[]');

        function renderCards(reportsToDisplay, category) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (reportsToDisplay.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 32px; color: #64748b; font-size: 14px;">لا توجد بلاغات مسجلة في خانة (' + category + ') حالياً.</div>';
                return;
            }

            let borderStyle = '1px solid #334155';
            if (category === 'شبيح') borderStyle = '3px solid #f87171';
            else if (category === 'تاجر مخدرات') borderStyle = '3px solid #fbbf24';
            else if (category === 'لص') borderStyle = '3px solid #38bdf8';
            else if (category === 'آخر') borderStyle = '3px solid #34d399';

            reportsToDisplay.forEach(function(report) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.borderTop = borderStyle;

                const reportId = report.id || '';

                let mediaSection = '<div><strong class="info-label" style="font-size: 13px;">🎞️ الأدلة المرفقة:</strong> <span style="color: #64748b; font-size: 13px;">لم يتم رفع أي ملفات وسائط</span></div>';
                if (report.filename && report.filename.trim() !== '') {
                    mediaSection = '<div class="media-box">' +
                                   '<span class="block-title" style="font-size: 13px; margin-bottom: 6px;">📷 صورة الدليل المرفوعة الحقيقية:</span>' +
                                   '<img src="' + report.filename + '" style="max-width: 100%; max-height: 160px; border-radius: 6px; margin: 0 auto 10px auto; display: block; border: 1px solid #334155;">' +
                                   '<a href="' + report.filename + '" download="evidence_file.jpg" class="download-btn">تحميل صورة الدليل للجهاز</a>' +
                                   '</div>';
                }

                // قراءة دقيقة مبنية على المسميات الفعلية لقاعدة بياناتك الظاهرة في الصورة السابقة
                let cardHTML = '<div class="info-grid">';
                cardHTML += '<div><span class="info-grid"><span class="info-label">الاسم:</span> ' + (report.suspect_name || 'بدون اسم') + '</span></div>';
                cardHTML += '<div><span class="info-grid"><span class="info-label">المحافظة:</span> ' + (report.province || 'غير محددة') + '</span></div>';
                cardHTML += '<div><span class="info-grid"><span class="info-label">الجنسية:</span> ' + (report.nationality || 'سوري') + '</span></div>';
                cardHTML += '<div><span class="info-grid"><span class="info-label">مكان السكن:</span> ' + (report.current_address || 'غير محدد') + '</span></div>';
                cardHTML += '<div style="grid-column: span 2;"><span class="info-label">حسابات التواصل له:</span> ' + (report.social_link || 'غير متوفرة') + '</div>';
                cardHTML += '<div style="grid-column: span 2;"><span class="info-label">رقم الجوال:</span> <span dir="ltr">' + (report.phone || 'غير متوفر') + '</span></div>';
                cardHTML += '</div>';

                cardHTML += '<div class="block-section">';
                cardHTML += '<span class="block-title">أين كان يعمل ومع من (سجل الفعال):</span>';
                cardHTML += '<div class="block-text">' + (report.combat_history || 'لا توجد تفاصيل لجهة العمل المذكورة') + '</div>';
                cardHTML += '</div>';

                cardHTML += mediaSection;

                if (report.details && report.details.trim() !== '') {
                    cardHTML += '<div class="block-section">';
                    cardHTML += '<span class="block-title">تفاصيل إضافية حول البلاغ:</span>';
                    cardHTML += '<div class="block-text">' + report.details + '</div>';
                    cardHTML += '</div>';
                }

                cardHTML += '<div class="action-bar">';
                cardHTML += '<form action="/delete-report/' + reportId + '" method="POST" style="margin: 0;" onsubmit="return confirm(\'هل أنت متأكد من حذف هذا التقرير نهائياً؟\');">';
                cardHTML += '<button type="submit" class="delete-btn">حذف التقرير</button>';
                cardHTML += '</form>';
                cardHTML += '</div>';

                card.innerHTML = cardHTML;
                container.appendChild(card);
            });
        }

        function filterReports(category) {
            document.getElementById('categoryTitle').innerText = 'التقارير الواردة في خانة: ' + category;
            const filtered = allReports.filter(function(r) { return r.report_type === category; });
            renderCards(filtered, category);
        }
    </script>
</body>
</html>

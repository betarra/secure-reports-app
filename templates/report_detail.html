<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل البلاغ السري</title>
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { background-color: #0f172a !important; color: #f1f5f9 !important; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex items-center justify-center">

    <div style="background-color: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 16px; max-width: 600px; width: 100%;">
        <h1 style="color: #34d399; font-size: 22px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 10px;">تفاصيل المستند والمعلومات الواردة</h1>
        
        <div style="display: flex; flex-direction: column; gap: 14px; font-size: 16px;">
            <p><strong style="color: #94a3b8;">اسم المشتبه به:</strong> <span style="color: white; font-weight: bold;">{{ report.suspect_name }}</span></p>
            <p><strong style="color: #94a3b8;">المحافظة:</strong> <span style="color: #cbd5e1;">{{ report.province }}</span></p>
            <p><strong style="color: #94a3b8;">رقم الهاتف:</strong> <span style="color: #cbd5e1;" dir="ltr">{{ report.phone or 'غير متوفر' }}</span></p>
            <p><strong style="color: #94a3b8;">التصنيف:</strong> <span style="color: #fbbf24; font-weight: bold;">{{ report.category }}</span></p>
            
            <div style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 14px;">
                <strong style="color: #94a3b8; display: block; margin-bottom: 6px;">تفاصيل الجرم والأدلة المرفقة:</strong>
                <div style="background-color: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; color: #cbd5e1; line-height: 1.6; white-space: pre-line;">
                    {{ report.details or 'لا توجد تفاصيل إضافية مسجلة.' }}
                </div>
            </div>
        </div>

        <div style="margin-top: 24px; display: flex; gap: 12px;">
            <button onclick="window.print()" style="flex: 1; background-color: #d97706; color: white; padding: 10px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer;">طباعة هذا التقرير</button>
            <a href="/admin" style="flex: 1; background-color: #475569; color: white; padding: 10px; border-radius: 8px; font-weight: 500; text-align: center; text-decoration: none;">العودة للوحة التحكم</a>
        </div>
    </div>

</body>
</html>

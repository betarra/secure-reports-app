<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البلاغات السرية الآمنة</title>
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { background-color: #0f172a !important; color: #f1f5f9 !important; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex items-center justify-center">

    <div style="background-color: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 16px; max-width: 500px; width: 100%;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <h1 style="color: #34d399; font-size: 24px; font-weight: bold; margin-bottom: 8px;">منصة البلاغات السرية الآمنة</h1>
            <p style="color: #94a3b8; font-size: 14px;">يتم إرسال كافة البيانات المذكورة هنا بسرية تامة ومباشرة لقسم التحقيق.</p>
        </div>

        {% if get_flashed_messages() %}
            {% for message in get_flashed_messages() %}
              <div style="padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; background-color: #065f46; color: #34d399;">
                  {{ message }}
              </div>
            {% endfor %}
        {% endif %}

        <!-- تم إضافة enctype="multipart/form-data" للسماح برفع الملفات الحقيقية -->
        <form action="/submit" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 16px;">
            
            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">اسم المشتبه به الكامل:</label>
                <input type="text" name="suspect_name" required style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">أولاً: تصنيف نوع الجرم:</label>
                <select name="category" required style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; cursor: pointer;">
                    <option value="شبيح">شبيح</option>
                    <option value="تاجر مخدرات">تاجر مخدرات</option>
                    <option value="لص">لص</option>
                    <option value="آخر">آخر</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">ثانياً: من أي محافظة؟</label>
                <select name="province" required style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; cursor: pointer;">
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حلب">حلب</option>
                    <option value="حمص">حمص</option>
                    <option value="حماة">حماة</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="طرطوس">طرطوس</option>
                    <option value="إدلب">إدلب</option>
                    <option value="دير الزور">دير الزور</option>
                    <option value="الرقة">الرقة</option>
                    <option value="الحسكة">الحسكة</option>
                    <option value="درعا">درعا</option>
                    <option value="السويداء">السويداء</option>
                    <option value="القنيطرة">القنيطرة</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">ثالثاً: أين كان يعمل؟ ومع من؟ (تفاصيل الجهة والشركاء):</label>
                <textarea name="work_details" rows="3" required style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <!-- رابعاً: إرفاق صورة أو فيديو حقيقي من الجهاز -->
            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">رابعاً: اختر صورة أو فيديو للمشتبه به كدليل من جهازك (إن وجد):</label>
                <input type="file" name="evidence_file" accept="image/*,video/*" style="width: 100%; padding: 8px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: #94a3b8; box-sizing: border-box; cursor: pointer;">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">خامساً: رابط أي موقع تواصل اجتماعي له (إن وجد):</label>
                <input type="text" name="social_link" placeholder="@username أو رابط الحساب" style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">سادساً: رقم جواله المتاح (إن وجد):</label>
                <input type="text" name="phone" style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;" dir="ltr">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px;">تفاصيل إضافية حول البلاغ:</label>
                <textarea name="details" rows="3" style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <button type="submit" style="width: 100%; background-color: #059669; color: white; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px;">
                إرسال البلاغ الآن
            </button>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البلاغات السرية الآمنة</title>
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { 
            background-color: #0f172a !important; 
            color: #f1f5f9 !important; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        .form-container {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
        }
        input, select, textarea {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 flex items-center justify-center">

    <div class="form-container bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-5 sm:p-8" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 16px;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <h1 style="color: #34d399; font-size: 22px; font-weight: bold; margin-bottom: 8px;">منصة البلاغات السرية الآمنة</h1>
            <p style="color: #94a3b8; font-size: 13px; line-height: 1.5;">يتم إرسال كافة البيانات المذكورة هنا بسرية تامة ومباشرة لقسم التحقيق.</p>
        </div>

        {% if get_flashed_messages() %}
            {% for message in get_flashed_messages() %}
              <div style="padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; background-color: #065f46; color: #34d399; font-weight: bold;">
                  {{ message }}
              </div>
            {% endfor %}
        {% endif %}

        <form action="/submit" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            
            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">اسم المشتبه به الكامل:</label>
                <input type="text" name="suspect_name" required style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">أولاً: تصنيف نوع الجرم:</label>
                <select name="category" required style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; cursor: pointer;">
                    <option value="شبيح">شبيح</option>
                    <option value="تاجر مخدرات">تاجر مخدرات</option>
                    <option value="لص">لص</option>
                    <option value="آخر">آخر</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">ثانياً: من أي محافظة؟</label>
                <select name="province" required style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; cursor: pointer;">
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حلب">حلب</option>
                    <option value="حمص">حمص</option>
                    <option value="حماة">حماة</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="طرطوس">طرطوس</option>
                    <option value="إدلب">إدلب</option>
                    <option value="دير الزور">دير الزور</option>
                    <option value="الرقة">الرقة</option>
                    <option value="الحسكة">الحسكة</option>
                    <option value="درعا">درعا</option>
                    <option value="السويداء">السويداء</option>
                    <option value="القنيطرة">القنيطرة</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">ثالثاً: أين كان يعمل؟ ومع من؟ (تفاصيل الجهة والشركاء):</label>
                <textarea name="work_details" rows="3" required style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">رابعاً: اختر صورة للمشتبه به كدليل من جهازك (إن وجد):</label>
                <input type="file" id="fileInput" accept="image/*" style="width: 100%; padding: 10px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: #94a3b8; box-sizing: border-box; cursor: pointer;">
                <input type="hidden" name="media_data" id="mediaData">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">خامساً: رابط أي موقع تواصل اجتماعي له (إن وجد):</label>
                <input type="text" name="social_link" placeholder="@username أو رابط الحساب" style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">سادساً: رقم جواله المتاح (إن وجد):</label>
                <input type="text" name="phone" style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box;" dir="ltr">
            </div>

            <div>
                <label style="display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">تفاصيل إضافية حول البلاغ:</label>
                <textarea name="details" rows="3" style="width: 100%; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <button type="submit" id="submitBtn" style="width: 100%; background-color: #059669; color: white; padding: 14px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; font-size: 16px;">
                إرسال البلاغ الآن
            </button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // قفل الزر وتغيير حالته لحين اكتمال عملية المعالجة الآمنة
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = '#4b5563';
            submitBtn.innerText = 'جاري معالجة وضغط الصورة بسرية...';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const MAX_WIDTH = 500;
                    const MAX_HEIGHT = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('mediaData').value = compressedBase64;

                    // إعادة تفعيل الزر فور انتهاء الضغط بنجاح
                    submitBtn.disabled = false;
                    submitBtn.style.backgroundColor = '#059669';
                    submitBtn.innerText = 'إرسال البلاغ الآن';
                }
            }
        });
    </script>
</body>
</html>
